[project]
name = "delta"
version = "0.1.0"
description = "Records beta.Decisions in a hash-chained ledger, tracks outcome obligations, and feeds resolved outcomes into cohort-level fairness screening."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@f778be1f5ac27372df8ce61dbe0a8c42f9dc8c3b",
    "beta @ git+https://github.com/wking53214/interconnected_beta@3b0d46c6b4d3fbdc18ba26154d49a984a9b9c12d",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional: lets a LedgerEntry or OutcomeObligation be bound to a CNS verdict (delta.cns_connector). Nothing in delta imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["delta"]
