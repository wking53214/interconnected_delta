[project]
name = "delta"
version = "0.1.0"
description = "Records beta.Decisions in a hash-chained ledger, tracks outcome obligations, and feeds resolved outcomes into cohort-level fairness screening."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@7cee0a35be741c6f299ffcd2a024c4edfcbaa80d",
    "beta @ git+https://github.com/wking53214/interconnected_beta@b24739715dd49bb19e0413e9a8f9bf20bd897e10",
]

[project.optional-dependencies]
# cryptography is not declared here: CI installs it directly for the tests' Ed25519 fixtures (the spine policy forbids it in an extra).
dev = ["pytest>=7.0"]
# Optional: lets a LedgerEntry or OutcomeObligation be bound to a CNS verdict (delta.cns_connector). Nothing in delta imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["delta"]
