[project]
name = "delta"
version = "0.1.0"
description = "Records beta.Decisions in a hash-chained ledger, tracks outcome obligations, and feeds resolved outcomes into cohort-level fairness screening."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@e49421aa5a80859f9c7c27b7586bb419c9946076",
    "beta @ git+https://github.com/wking53214/interconnected_beta@5325a5d8b2381605f2ca60a141671067d5ffc1c1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional: lets a LedgerEntry or OutcomeObligation be bound to a CNS verdict (delta.cns_connector). Nothing in delta imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["delta"]
