[project]
name = "delta"
version = "0.1.0"
description = "Records beta.Decisions in a hash-chained ledger, tracks outcome obligations, and feeds resolved outcomes into cohort-level fairness screening."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta@57623483ec51b09601a32cc44a41c2bc097e88db",
    "beta @ git+https://github.com/wking53214/interconnected_beta@9b0f6160337dcb39a652cf6a9008fbe8e2b7ffc5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional: lets a LedgerEntry or OutcomeObligation be bound to a CNS verdict (delta.cns_connector). Nothing in delta imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v2.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["delta"]
